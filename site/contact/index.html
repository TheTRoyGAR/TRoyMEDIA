<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | TRoy Media Agency&trade;</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --bg: #0a0a12;
      --bg2: #12121c;
      --accent: #c8a96e;
      --accent2: #e8578a;
      --text: #f0f0ee;
      --muted: #8a8a92;
      --border: #201f28;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Helvetica Neue", Arial, sans-serif; line-height: 1.7; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 48px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; color: var(--accent); text-decoration: none; }
    .nav-logo img { width: 32px; height: 32px; border-radius: 50%; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px 100px; }
    h1 { font-size: 34px; color: var(--accent2); margin-bottom: 8px; }
    .updated { color: var(--muted); font-size: 13px; margin-bottom: 40px; }
    h2 { font-size: 20px; color: var(--text); margin: 36px 0 12px; }
    p, li { color: var(--text); opacity: 0.85; font-size: 15px; margin-bottom: 12px; }
    ul { padding-left: 22px; }
    a { color: var(--accent); }
    strong { color: var(--text); }
    footer { text-align: center; padding: 40px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/"><img src="/images/logo.png" alt="TRoy Media Agency&trade;" />TRoy Media Agency&trade;</a>
  </nav>
  <main>
    <h1>Contact Us</h1>
    <p class="updated">Last updated: 1 September 2026</p>
    
<h2>Get in touch</h2>
<p>Email: <a href="mailto:agency@troymediagency.com">agency@troymediagency.com</a></p>
<p>Based in Australia.</p>

  </main>
  <footer>
    TRoy Media Agency&trade; · <a href="mailto:agency@troymediagency.com">agency@troymediagency.com</a><br />
    ABN 30 302 098 137
  </footer>
</body>
</html>
