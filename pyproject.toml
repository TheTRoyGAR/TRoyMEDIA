[project]
name = "troymedia-agency"
version = "1.0.0"
description = "TRoyMEDIAgency — AI-Agent-Automated TV/Film Production & Talent Agency"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "google-genai>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agency"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
